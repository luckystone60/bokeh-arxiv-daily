# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "luckystone60"
repo_name: "bokeh-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# archive: README.md / index.md only keep the latest papers of each keyword
# (github stops rendering markdown beyond 512 KB), all papers are archived by
# year, one markdown per keyword: <archive_dir>/<year>/<Keyword>.md, shared by
# the README and the gitpage
max_papers_in_readme: 200
archive_dir: './docs/archive'

# code links: PapersWithCode is gone, github repos are looked up from the paper's
# abstract, Hugging Face papers and GitHub code search (needs GITHUB_TOKEN, 10
# requests/min). The weekly update re-checks papers without code published within
# code_check_days (<= 0 for all), at most max_code_checks papers per run, least
# recently checked first; code_checks_path remembers when each paper was checked;
# GitHub searches stop after max_code_search_minutes so the job finishes in time
code_check_days: 180
max_code_checks: 300
max_code_search_minutes: 40
code_checks_path: './docs/code-checks.json'

# keywords to search, optional "categories" limit the arxiv categories (eg. cs.CV)
# of one keyword; a top-level "categories" would apply to all keywords
keywords:
    "DepthEstimation": 
        filters: ["MDE", "Depth Estimation", "Geometry Estimation", "Depth Refine", "Video Depth Estimation", "Metric Depth"]
    "Bokeh":
        filters: ["Bokeh", "Video Bokeh"]
    "Matting":
        filters: ["Potrait","Matting"]
